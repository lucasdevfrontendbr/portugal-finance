<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portugal Finance SDR</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;500;700&display=swap');
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            font-family: 'Rajdhani', sans-serif;
            background: #0a0a0f;
            min-height: 100vh;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            color: #00ff88;
        }
        
        /* GRID SDR TECH NO FUNDO */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(0,255,136,0.1) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0,255,136,0.1) 1px, transparent 1px);
            background-size: 50px 50px;
            animation: grid-move 20s linear infinite;
            z-index: 1;
        }
        
        @keyframes grid-move {
            0% { transform: translate(0, 0); }
            100% { transform: translate(50px, 50px); }
        }
        
        /* CUBO 3D SDR TECH */
        .scene {
            width: 250px;
            height: 250px;
            perspective: 1000px;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 2;
        }
        .cube {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            animation: girar 15s infinite linear;
        }
        .cube-face {
            position: absolute;
            width: 250px;
            height: 250px;
            border: 2px solid #00ff88;
            background: rgba(0,255,136,0.05);
            box-shadow: 
                inset 0 0 20px rgba(0,255,136,0.2),
                0 0 30px rgba(0,255,136,0.3);
        }
        .cube-face::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 60%;
            height: 60%;
            border: 1px solid #00ff88;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 10px rgba(0,255,136,0.5);
        }
        .cube-face-front  { transform: rotateY(0deg) translateZ(125px); }
        .cube-face-right  { transform: rotateY(90deg) translateZ(125px); }
        .cube-face-back   { transform: rotateY(180deg) translateZ(125px); }
        .cube-face-left   { transform: rotateY(-90deg) translateZ(125px); }
        .cube-face-top    { transform: rotateX(90deg) translateZ(125px); }
        .cube-face-bottom { transform: rotateX(-90deg) translateZ(125px); }
        
        @keyframes girar {
            from { transform: rotateX(0deg) rotateY(0deg); }
            to { transform: rotateX(360deg) rotateY(360deg); }
        }
        
        .container {
            background: rgba(10,10,15,0.9);
            border: 1px solid #00ff88;
            border-radius: 8px;
            box-shadow: 
                0 0 30px rgba(0,255,136,0.4),
                inset 0 0 30px rgba(0,255,136,0.1);
            padding: 40px;
            width: 100%;
            max-width: 450px;
            position: relative;
            z-index: 10;
            backdrop-filter: blur(15px);
        }
        
        .container::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            background: linear-gradient(45deg, #00ff88, #0088ff, #ff0088, #00ff88);
            border-radius: 8px;
            z-index: -1;
            animation: border-glow 3s linear infinite;
            opacity: 0.5;
        }
        
        @keyframes border-glow {
            0%, 100% { filter: hue-rotate(0deg); }
            50% { filter: hue-rotate(180deg); }
        }
        
        h1 { 
            font-family: 'Orbitron', sans-serif;
            color: #00ff88; 
            font-size: 28px; 
            margin-bottom: 8px; 
            text-align: center;
            text-shadow: 0 0 10px rgba(0,255,136,0.8);
            font-weight: 900;
            letter-spacing: 2px;
        }
        .subtitle {
            color: #0088ff;
            text-align: center;
            margin-bottom: 32px;
            font-size: 14px;
            font-weight: 300;
            letter-spacing: 3px;
            text-transform: uppercase;
        }
        .form-group { margin-bottom: 28px; }
        label { 
            display: block; 
            color: #00ff88; 
            font-weight: 700; 
            margin-bottom: 10px; 
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        input {
            width: 100%;
            padding: 14px 18px;
            border: 1px solid #00ff88;
            border-radius: 4px;
            font-size: 18px;
            transition: all 0.3s;
            background: rgba(0,0,0,0.5);
            color: #00ff88;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
        }
        input:focus {
            outline: none;
            border-color: #0088ff;
            box-shadow: 
                0 0 20px rgba(0,136,255,0.5),
                inset 0 0 10px rgba(0,136,255,0.2);
        }
        input::placeholder {
            color: rgba(0,255,136,0.3);
        }
        .result {
            margin-top: 28px;
            padding: 24px;
            background: rgba(0,0,0,0.6);
            border: 1px solid #00ff88;
            border-radius: 4px;
            min-height: 100px;
            box-shadow: 
                inset 0 0 20px rgba(0,255,136,0.1),
                0 0 20px rgba(0,255,136,0.2);
        }
        .result-value {
            font-family: 'Orbitron', sans-serif;
            font-size: 36px;
            font-weight: 900;
            color: #00ff88;
            margin-bottom: 12px;
            text-shadow: 0 0 15px rgba(0,255,136,0.8);
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.8; }
        }
        .result-detail {
            color: #0088ff;
            font-size: 13px;
            line-height: 1.8;
            font-weight: 500;
        }
        .result-detail strong {
            color: #00ff88;
            text-shadow: 0 0 5px rgba(0,255,136,0.5);
        }
        
        @media (max-width: 480px) {
            .scene { width: 150px; height: 150px; }
            .cube-face { width: 150px; height: 150px; }
            .cube-face-front  { transform: rotateY(0deg) translateZ(75px); }
            .cube-face-right  { transform: rotateY(90deg) translateZ(75px); }
            .cube-face-back   { transform: rotateY(180deg) translateZ(75px); }
            .cube-face-left   { transform: rotateY(-90deg) translateZ(75px); }
            .cube-face-top    { transform: rotateX(90deg) translateZ(75px); }
            .cube-face-bottom { transform: rotateX(-90deg) translateZ(75px); }
            .container { padding: 28px; }
            h1 { font-size: 22px; }
            .result-value { font-size: 28px; }
        }
    </style>
</head>
<body>
    <!-- CUBO 3D SDR TECH -->
    <div class="scene">
        <div class="cube">
            <div class="cube-face cube-face-front"></div>
            <div class="cube-face cube-face-back"></div>
            <div class="cube-face cube-face-right"></div>
            <div class="cube-face cube-face-left"></div>
            <div class="cube-face cube-face-top"></div>
            <div class="cube-face cube-face-bottom"></div>
        </div>
    </div>

    <div class="container">
        <h1>PORTUGAL FINANCE</h1>
        <p class="subtitle">// Sistema SDR Tech v2.0 //</p>
        
        <div class="form-group">
            <label for="bruto">> Salário_Bruto.exe</label>
            <input type="number" id="bruto" placeholder="0000.00 €" oninput="calcular()">
        </div>
        
        <div class="form-group">
            <label for="dependentes">> Dependentes.sys</label>
            <input type="number" id="dependentes" placeholder="0" oninput="calcular()">
        </div>
        
        <div id="resultado" class="result">
            <div class="result-value">€0.00</div>
            <div class="result-detail">// Aguardando input do usuário...</div>
        </div>
    </div>

    <script>
        function calcular() {
            const bruto = parseFloat(document.getElementById('bruto').value) || 0;
            const dependentes = parseInt(document.getElementById('dependentes').value) || 0;
            
            if (bruto === 0) {
                document.getElementById('resultado').innerHTML = `
                    <div class="result-value">€0.00</div>
                    <div class="result-detail">// Aguardando input do usuário...</div>
                `;
                return;
            }
            
            const ss = bruto * 0.11;
            const irs = Math.max(0, bruto * 0.15 - (dependentes * 50));
            const liquido = bruto - ss - irs;
            
            document.getElementById('resultado').innerHTML = `
                <div class="result-value">€${liquido.toFixed(2)}</div>
                <div class="result-detail">
                    > BRUTO: €${bruto.toFixed(2)}<br>
                    > SEG_SOCIAL: -€${ss.toFixed(2)}<br>
                    > IRS_TAX: -€${irs.toFixed(2)}<br>
                    > <strong>LÍQUIDO: €${liquido.toFixed(2)}</strong><br>
                    // Processamento concluído //
                </div>
            `;
        }
        calcular();
    </script>
</body>
</html>
